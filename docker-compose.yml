# Full stack: PostgreSQL 16, pgAdmin, and ReliefLink.
#   docker compose up --build
#   dashboard → http://localhost:8080      pgAdmin → http://localhost:5050
#
# Change every password below before using this anywhere but your own machine.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  setup:   # one-shot: creates database, roles, schema and demo data
    build: .
    command: ["setup"]
    environment: &dbenv
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      RELIEF_APP_PASSWORD: relief_app_dev
      RELIEF_ANALYST_PASSWORD: relief_analyst_dev
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    command: ["serve"]
    environment: *dbenv
    ports: ["8080:8080"]
    depends_on:
      setup: { condition: service_completed_successfully }

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["5050:80"]
    volumes: [./scripts/pgadmin-servers.json:/pgadmin4/servers.json:ro]
    depends_on: [db]

volumes:
  pgdata:
